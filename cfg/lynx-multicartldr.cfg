#
# lynx-multicartldr.cfg -- link config used ONLY to build the relocatable
# multicart runtime loader (runtime/lynx/multicartldr.s) so its bytes can be
# extracted. It locates CODE at $0040 (where multicart_run copies and runs the
# loader) with no C startup, stack or header. The resulting raw image is the
# committed blob libraries/core/multicartldr_gen.s; regenerate with
# tools/lnx/gen-multicartldr.sh. See design/LYNX_MULTICART_DESIGN.md.
#

SYMBOLS {
    __STACKSIZE__:        type = weak, value = $0000; # no stack: pure loader
    __BANK0BLOCKSIZE__:   type = weak, value = $0800; # 2048 B/block (512 KiB)
    __BLOCKSIZE__:        type = weak, value = __BANK0BLOCKSIZE__;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0000, size = $0100;
    MAIN: file = %O, define = yes, start = $0040, size = 202;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro, define = yes;
    RODATA:   load = MAIN, type = ro, define = yes, optional = yes;
    DATA:     load = MAIN, type = rw, define = yes, optional = yes;
    BSS:      load = MAIN, type = bss, define = yes, optional = yes;
}
