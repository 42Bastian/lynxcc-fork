SYMBOLS {
    __STACKSIZE__:        type = weak, value = $0400; # 1k stack
    __STARTOFDIRECTORY__: type = weak, value = $00CB; # start just after loader
    __BANK0BLOCKSIZE__:   type = weak, value = $0400; # 1024-byte blocks -> 256k
    __BANK1BLOCKSIZE__:   type = weak, value = $0000; # bank 1 block size
    __CARTSIZE__:         type = weak, value = $40000; # 256k = 1024 * 256
    __EXEHDR__:           type = import;
    __BOOTLDR__:          type = import;
    __DEFDIR__:           type = import;
    # Physical load address of the reclaimable ONCE one-shot body. On the padded
    # cart-size cfgs MAIN's fill lands ONCE at its run address, so ONCE is
    # already in place and crt0's relocator self-copies. See
    # design/LYNX_STARTUP_RECLAIM_DESIGN.md.
    __ONCE_PHYS__:        type = export, value = __ONCE_RUN__;
}
MEMORY {
    ZP:      file = "", define = yes, start = $0000, size = $0100;
    HEADER:  file = %O,               start = $0000, size = $0040;
    BOOT:    file = %O,               start = $0200, size = __STARTOFDIRECTORY__, fill = yes;
    DIR:     file = %O,               start = $0000, size = 8;
    MAIN:    file = %O, define = yes, start = $0200, size = $BE38 - __STACKSIZE__, fill = yes;
    ROMFILL: file = %O,               start = $0000,
             size = __CARTSIZE__ - (($BE38 - __STACKSIZE__) + __STARTOFDIRECTORY__ + 8),
             fill = yes, fillval = $42;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,      type = zp;
    EXTZP:     load = ZP,      type = zp,                optional = yes;
    APPZP:     load = ZP,      type = zp,                optional = yes;
    EXEHDR:    load = HEADER,  type = ro;
    BOOTLDR:   load = BOOT,    type = ro;
    DIRECTORY: load = DIR,     type = ro;
    STARTUP:   load = MAIN,    type = ro,  define = yes;
    CODE:      load = MAIN,    type = ro,  define = yes;
    RODATA:    load = MAIN,    type = ro,  define = yes;
    DATA:      load = MAIN,    type = rw,  define = yes;
    BSS:       load = MAIN,    type = bss, define = yes;
    # ONCE runs above BSS so the heap reclaims it. MAIN's fill spans the BSS gap
    # ahead of it; the directory copy length covers it (see defdir.s).
    ONCE:      load = MAIN,    type = ro,  define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
