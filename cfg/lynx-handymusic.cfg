SYMBOLS {
    __STACKSIZE__:        type = weak, value = $0400; # 1k stack
    __STARTOFDIRECTORY__: type = weak, value = $00CB; # start just after loader
    __BANK0BLOCKSIZE__:   type = weak, value = $0400; # bank 0 cart block size
    __BANK1BLOCKSIZE__:   type = weak, value = $0000; # bank 1 block size
    __EXEHDR__:           type = import;
    __BOOTLDR__:          type = import;
    __DEFDIR__:           type = import;
    # Physical load address of the reclaimable ONCE one-shot body: packed
    # straight after DATA in the verbatim-copied image, so this is __BSS_RUN__.
    # See design/LYNX_STARTUP_RECLAIM_DESIGN.md.
    __ONCE_PHYS__:        type = export, value = __BSS_RUN__;
    # HandyMusic reserved data regions (design/LYNX_HANDYMUSIC_DESIGN.md
    # sec. 3.2 / 4.3).  These fixed bases are handed to bin/hmcc so the absolute
    # pointer tables it bakes into the .sfx / .mus blobs are valid once the game
    # copies each blob to its base at startup.  They sit ABOVE the C stack (like
    # the collision buffer): MAIN is shrunk so the stack top lands at $AE00 and
    # the heap can never grow into them.
    __HMSFX_START__:      type = export, value = $AE00; # SFX blob base   ($AE00..$AFFF)
    __HMMUS_START__:      type = export, value = $B000; # music blob base ($B000..$C037)
}
MEMORY {
    ZP:     file = "", define = yes, start = $0000, size = $0100;
    HEADER: file = %O,               start = $0000, size = $0040;
    BOOT:   file = %O,               start = $0200, size = __STARTOFDIRECTORY__;
    DIR:    file = %O,               start = $0000, size = 8;
    # MAIN ends at $AA00; the 1k stack tops out at $AE00 (= __HMSFX_START__),
    # leaving [$AE00,$C038) reserved for the HandyMusic data regions above.
    MAIN:   file = %O, define = yes, start = $0200, size = $AC00 - __STACKSIZE__;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    EXTZP:     load = ZP,     type = zp,                optional = yes;
    APPZP:     load = ZP,     type = zp,                optional = yes;
    EXEHDR:    load = HEADER, type = ro;
    BOOTLDR:   load = BOOT,   type = ro;
    DIRECTORY: load = DIR,    type = ro;
    STARTUP:   load = MAIN,   type = ro,  define = yes;
    LOWCODE:   load = MAIN,   type = ro,  define = yes, optional = yes;
    CODE:      load = MAIN,   type = ro,  define = yes;
    RODATA:    load = MAIN,   type = ro,  define = yes;
    DATA:      load = MAIN,   type = rw,  define = yes;
    BSS:       load = MAIN,   type = bss, define = yes;
    # ONCE runs at the top of the static area (above BSS) so the heap reclaims
    # it; its bytes pack into the image straight after DATA (no BSS hole). See
    # design/LYNX_STARTUP_RECLAIM_DESIGN.md.
    ONCE:      load = MAIN,   type = ro,  define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
